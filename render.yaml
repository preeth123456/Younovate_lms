# Younovate LMS — Render blueprint
#
# IMPORTANT: The LMS API is the Express app in backend/.
# Frontend is on Vercel — do NOT build the Next.js app at repo root for the API service.
#
# Manual Render dashboard settings (if not using this blueprint):
#   Root Directory:  backend
#   Build Command:   npm install
#   Start Command:   npm start
#   NODE_ENV:        production

services:
  - type: web
    name: younovate-lms-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
