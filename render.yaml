# Younovate LMS — Render blueprint
#
# IMPORTANT: The LMS API is the Express app in backend/.
# Frontend is on Vercel — do NOT build the Next.js app at repo root for the API service.
#
# Manual Render dashboard settings (if not using this blueprint):
#   Root Directory:  backend
#   Build Command:   npm install
#   Start Command:   npm start
#   NODE_ENV:        production
#   RESEND_API_KEY:  your Resend API key (recommended for email)
#   RESEND_FROM:     verified sender, e.g. Younovate Labs <noreply@younovate.in>
#
# LiveKit Cloud + S3 recording (set in Render dashboard → Environment):
#   LIVEKIT_URL=wss://your-project.livekit.cloud
#   LIVEKIT_API_KEY=...
#   LIVEKIT_API_SECRET=...
#   PUBLIC_API_URL=https://your-api.onrender.com
#   USE_S3_RECORDING=true
#   S3_BUCKET=lms-recordings-prod
#   AWS_REGION=ap-south-1
#   AWS_ACCESS_KEY_ID=...        (secret — do not commit)
#   AWS_SECRET_ACCESS_KEY=...    (secret — do not commit)

services:
  - type: web
    name: younovate-lms-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_S3_RECORDING
        value: "true"
      - key: S3_BUCKET
        value: lms-recordings-prod
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
